spring.application.name=ai-proxy-platform
server.port=${PORT:8080}

# Comma-separated list of allowed frontend origins (set FRONTEND_URL in Railway to your Vercel URL)
app.cors.allowed-origins=${FRONTEND_URL:http://localhost:5173}

# Time zone used for daily history, monthly reset and scheduled jobs
app.timezone=${APP_TIMEZONE:America/Bogota}

# Simulated latency of the real AI service (requirement: 1200 ms)
app.ai.mock-latency-ms=${AI_MOCK_LATENCY_MS:1200}

management.endpoints.web.exposure.include=health
