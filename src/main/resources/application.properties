spring.application.name=ai-proxy-platform
server.port=${PORT:8080}

# Comma-separated list of allowed frontend origins. Wildcards are supported (allowedOriginPatterns).
# The default already covers local dev and the Vercel deployment; set FRONTEND_URL to override it.
app.cors.allowed-origins=${FRONTEND_URL:http://localhost:5173,https://fronted-proxy-seven.vercel.app,https://fronted-proxy-*-cammb1004-9236.vercel.app}

# Time zone used for daily history, monthly reset and scheduled jobs
app.timezone=${APP_TIMEZONE:America/Bogota}

# Simulated latency of the real AI service (requirement: 1200 ms)
app.ai.mock-latency-ms=${AI_MOCK_LATENCY_MS:1200}

management.endpoints.web.exposure.include=health
